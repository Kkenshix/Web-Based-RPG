<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Küllerin Krallığı — Karanlık RPG</title>
<style>
:root{--bg:#090909;--panel:#11110f;--panel2:#181713;--gold:#b8944d;--gold2:#e0c27a;--text:#eee9df;--muted:#9f988c;--red:#9c3030;--green:#507a59;--line:#312c23;--blue:#526c8e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#292319 0,#0c0c0b 38%,#050505 100%);color:var(--text);font:15px Georgia,serif;min-height:100vh}
button,input{font:inherit}button{color:var(--text)}.app{max-width:900px;margin:auto;min-height:100vh;padding-bottom:84px}.top{position:sticky;top:0;z-index:20;background:#090909eF;border-bottom:1px solid var(--line);backdrop-filter:blur(8px);padding:10px 12px}
.brand{display:flex;align-items:center;justify-content:space-between}.brand b{letter-spacing:.16em;color:var(--gold2)}.mini{font:12px system-ui;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}.stat{background:#15140f;border:1px solid #29251d;border-radius:8px;padding:6px;text-align:center;font:12px system-ui}.bar{height:5px;background:#2b2822;border-radius:4px;margin-top:4px;overflow:hidden}.fill{height:100%;transition:.25s}.hp{background:#9b3434}.mp{background:#506b91}.st{background:#947b3e}.cor{background:#6f427a}
.hero{min-height:250px;position:relative;display:flex;align-items:flex-end;overflow:hidden;border-bottom:1px solid var(--line);background:linear-gradient(#0002,#000d),radial-gradient(circle at 60% 25%,#6b604c 0 2%,transparent 3%),linear-gradient(150deg,#343024,#10100e 55%,#050505)}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(125deg,transparent 0 52%,#000 52% 55%,transparent 55%),linear-gradient(35deg,transparent 0 66%,#171611 66% 72%,transparent 72%);opacity:.6}
.heroText{position:relative;padding:24px 18px;width:100%;background:linear-gradient(transparent,#080808ee)}.kicker{font:11px system-ui;letter-spacing:.18em;color:var(--gold2);text-transform:uppercase}.hero h1{font-size:28px;margin:7px 0 4px}.content{padding:16px}.story{font-size:17px;line-height:1.7;color:#e4ded2}.choices{display:grid;gap:9px;margin-top:16px}.choice,.action{border:1px solid #3a3327;background:linear-gradient(#1b1915,#12110f);padding:13px 14px;border-radius:8px;text-align:left;min-height:48px}.choice:active,.action:active{border-color:var(--gold);background:#242018}.choice small{display:block;color:var(--muted);margin-top:4px;font:12px system-ui}.combat{display:none;margin:12px 16px;border:1px solid #4a3029;background:#150e0d;border-radius:10px;padding:13px}.enemyRow{display:flex;justify-content:space-between}.combatActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.combatActions button{background:#211713;border:1px solid #573a30;padding:11px;border-radius:7px}.log{font:12px system-ui;color:#c0b8aa;margin-top:8px;min-height:16px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#0b0b0bf5;border-top:1px solid var(--line);display:flex;justify-content:center}.navin{width:min(900px,100%);display:grid;grid-template-columns:repeat(6,1fr)}.nav button{border:0;background:none;padding:10px 2px 8px;font:10px system-ui;color:#aaa}.nav i{display:block;font-style:normal;font-size:18px;margin-bottom:3px}
.modal{display:none;position:fixed;z-index:40;inset:0;background:#000c;padding:20px 12px;overflow:auto}.sheet{max-width:700px;margin:20px auto;background:#11100e;border:1px solid #40382b;border-radius:12px;padding:16px}.sheet h2{color:var(--gold2);margin-top:0}.close{float:right;border:1px solid #444;background:#181818;border-radius:6px;padding:7px 10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card{border:1px solid #302c25;background:#171612;border-radius:8px;padding:11px}.card b{color:#d8c28e}.tag{display:inline-block;border:1px solid #51462f;color:#cdb77f;padding:3px 7px;border-radius:12px;font:11px system-ui;margin:3px}.locked{opacity:.45}.titleScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:25px;text-align:center;background:radial-gradient(circle,#292219,#090909 58%)}.titleBox{max-width:560px}.sigil{font-size:74px;color:var(--gold);filter:drop-shadow(0 0 18px #8b6d2c55)}.titleBox h1{font-size:38px;letter-spacing:.12em;margin:10px 0}.titleBox p{color:#aaa;line-height:1.6}.mainbtn{width:100%;padding:14px;margin:6px 0;background:#181510;border:1px solid var(--gold);border-radius:8px;color:var(--gold2);font-weight:bold}.creation{text-align:left;margin-top:18px}.creation input{width:100%;padding:12px;background:#0d0d0c;border:1px solid #3a3429;color:white;border-radius:7px;margin:6px 0 12px}.classes{display:grid;gap:8px}.classBtn{padding:12px;border:1px solid #3c3529;background:#12110f;border-radius:8px;text-align:left}.classBtn.sel{border-color:var(--gold);background:#201b12}.notice{padding:9px;border-left:2px solid var(--gold);background:#17140f;color:#c6bda9;font:12px system-ui;margin:10px 0}
@media(min-width:700px){.hero{min-height:330px}.grid{grid-template-columns:repeat(3,1fr)}.choices{grid-template-columns:1fr 1fr}.nav button{font-size:11px}}
</style></head>
<body>
<div id="title" class="titleScreen"><div class="titleBox">
<div class="sigil">♜</div><div class="kicker">Karanlık Fantezi RPG</div><h1>KÜLLERİN KRALLIĞI</h1>
<p>Taht öldü. Kan unutmadı. Her karar seni kurtarmakla kalmaz; neye dönüşeceğini belirler.</p>
<button class="mainbtn" id="newGame">YENİ OYUN</button><button class="mainbtn" id="continueGame">DEVAM ET</button>
<div id="creator" class="creation" style="display:none"><label>Karakter adı</label><input id="name" maxlength="18" value="Varis">
<div class="kicker">Sınıf seç</div><div class="classes" id="classes"></div><button class="mainbtn" id="begin">MÜHRÜ KABUL ET</button></div>
<div class="mini" style="margin-top:18px">Tek oyunculu • Otomatik kayıt • Mobil uyumlu • Çevrimdışı çalışır</div>
</div></div>
<div id="game" class="app" style="display:none">
<header class="top"><div class="brand"><b>KÜLLERİN KRALLIĞI</b><span class="mini" id="level">SV. 1</span></div>
<div class="stats"><div class="stat">CAN <span id="hpText"></span><div class="bar"><div id="hpBar" class="fill hp"></div></div></div><div class="stat">MANA <span id="mpText"></span><div class="bar"><div id="mpBar" class="fill mp"></div></div></div><div class="stat">DAYANIK <span id="stText"></span><div class="bar"><div id="stBar" class="fill st"></div></div></div><div class="stat">YOZLAŞMA <span id="corText"></span><div class="bar"><div id="corBar" class="fill cor"></div></div></div></div></header>
<section class="hero" id="hero"><div class="heroText"><div class="kicker" id="location"></div><h1 id="sceneTitle"></h1><div class="mini" id="weather"></div></div></section>
<section class="combat" id="combat"><div class="enemyRow"><b id="enemyName"></b><span id="enemyHP"></span></div><div class="bar"><div id="enemyBar" class="fill hp"></div></div><div class="combatActions"><button data-act="attack">⚔ Saldır</button><button data-act="skill">✦ Yetenek</button><button data-act="guard">🛡 Savun</button><button data-act="potion">⚗ İksir</button></div><div class="log" id="combatLog"></div></section>
<main class="content"><div class="story" id="story"></div><div class="choices" id="choices"></div></main>
</div>
<nav class="nav" id="nav" style="display:none"><div class="navin"><button data-menu="char"><i>♟</i>Karakter</button><button data-menu="inv"><i>⚔</i>Çanta</button><button data-menu="skills"><i>✦</i>Yetenek</button><button data-menu="quests"><i>☷</i>Görev</button><button data-menu="map"><i>⌖</i>Harita</button><button data-menu="system"><i>⚙</i>Sistem</button></div></nav>
<div class="modal" id="modal"><div class="sheet"><button class="close" id="close">Kapat</button><div id="modalContent"></div></div></div>
<script>
const CLASSES={
 "Kan Şövalyesi":{hp:135,mp:35,st:100,atk:17,def:8,skill:"Kan Yarığı",desc:"Yüksek can ve savunma. Can pahasına ölümcül vuruşlar."},
 "Mezar Avcısı":{hp:100,mp:55,st:115,atk:19,def:5,skill:"Gölge Oku",desc:"Kritik vuruş ve kaçınma ustası."},
 "Lanet Büyücüsü":{hp:78,mp:125,st:80,atk:22,def:3,skill:"Ruh Yakımı",desc:"Yüksek büyü hasarı. Yozlaşmayı güce dönüştürür."},
 "Sürgün":{hp:112,mp:65,st:100,atk:16,def:6,skill:"Son Yemin",desc:"Dengeli. Diyaloglarda fazladan seçenekler açar."}
};
const ITEMS={
 potion:{name:"Kızıl İksir",type:"tüketim",desc:"+45 Can"},
 rust:{name:"Paslı Uzun Kılıç",type:"silah",atk:3,desc:"+3 Saldırı"},
 ring:{name:"Yas Yüzüğü",type:"yüzük",mp:15,desc:"+15 Mana"},
 fang:{name:"Kara Kurt Dişi",type:"malzeme",desc:"Nadir simya malzemesi"},
 crown:{name:"Kırık Taç Parçası",type:"tılsım",desc:"Kraliyet kanına tepki veriyor."},
 key:{name:"Gümüş Mahzen Anahtarı",type:"anahtar",desc:"Kuzey mahzeninin kapısını açar."}
};
let G=null, selected="Kan Şövalyesi";
const $=x=>document.querySelector(x), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), rnd=n=>Math.floor(Math.random()*n)+1;
function fresh(name,cls){let c=CLASSES[cls];return{name,cls,level:1,xp:0,gold:20,hp:c.hp,maxHp:c.hp,mp:c.mp,maxMp:c.mp,st:c.st,maxSt:c.st,cor:0,humanity:100,atk:c.atk,def:c.def,skill:c.skill,inv:["potion","rust"],flags:{},quests:["Küllerin Çağrısı"],kills:0,scene:"prologue",ending:null};}
function save(){localStorage.setItem("ashesSave",JSON.stringify(G))}
function load(){try{return JSON.parse(localStorage.getItem("ashesSave"))}catch(e){return null}}
function ui(){if(!G)return;$("#level").textContent=`SV. ${G.level} • ${G.gold} ALTIN`;$("#hpText").textContent=`${G.hp}/${G.maxHp}`;$("#mpText").textContent=`${G.mp}/${G.maxMp}`;$("#stText").textContent=`${G.st}/${G.maxSt}`;$("#corText").textContent=G.cor;$("#hpBar").style.width=100*G.hp/G.maxHp+"%";$("#mpBar").style.width=100*G.mp/G.maxMp+"%";$("#stBar").style.width=100*G.st/G.maxSt+"%";$("#corBar").style.width=G.cor+"%";save()}
function enter(){$("#title").style.display="none";$("#game").style.display="block";$("#nav").style.display="block";render(G.scene||"prologue")}
function setHero(type){let h=$("#hero"), bg={village:"linear-gradient(#0003,#000c),radial-gradient(circle at 75% 20%,#a17d4c 0 1%,transparent 2%),linear-gradient(145deg,#373125,#12110f 55%,#050505)",forest:"linear-gradient(#0004,#000d),repeating-linear-gradient(100deg,#12150f 0 18px,#070807 19px 43px,#1a1c14 44px 51px)",crypt:"linear-gradient(#0002,#000e),radial-gradient(circle at 50% 25%,#5e3940,transparent 24%),linear-gradient(90deg,#080808,#28231d,#080808)",chapel:"linear-gradient(#0004,#000d),linear-gradient(120deg,#151515 45%,#373125 46% 49%,#0b0b0b 50%)",throne:"linear-gradient(#0002,#000d),radial-gradient(circle at 50% 20%,#703535,transparent 22%),linear-gradient(90deg,#090909,#292018,#090909)"}[type];h.style.background=bg||bg.village}
const SC={
prologue:{loc:"VEYRA SINIRI",title:"Kan Yağmuru",weather:"Gece • Fırtına • 3. Çan",art:"village",text:()=>`Üç gündür gökyüzünden kül yağıyor. <b>${G.name}</b>, Veyra kapısına vardığında muhafızların başları surlara çivilenmiş durumda. Boynundaki siyah mühür ilk kez ısınıyor.<br><br>Kapının altında yaralı bir çocuk, uzakta ise siyah pelerinli bir kadın seni izliyor. Ormandan kurt ulumaları yaklaşıyor.`,choices:()=>[
["Yaralı çocuğu kurtar","child","İnsanlık +8 • Veyra halkı bunu hatırlayacak"],
["Pelerinli kadını takip et","lyra","Ana hikâyeyi hızlandır"],
["Ölü muhafızı yağmala","loot","Yozlaşma +7 • Eşya kazan"]
]},
child:{loc:"VEYRA",title:"Son Nefes",weather:"Çanlar sustu",art:"village",text:()=>`Çocuğu enkazdan çıkarıyorsun. Avucuna kanlı bir madalyon bırakıyor. “Mahzen... kral hâlâ rüya görüyor.”<br><br>Köylüler seni surların içinden görüyor. İlk kez yabancı değil, bir kurtarıcı gibi bakıyorlar.`,choices:()=>[["Hana götür","inn","Yeni görev ve dinlenme"],["Ormana doğru ilerle","wolf","Tehlike"]]},
loot:{loc:"VEYRA KAPISI",title:"Ölülerin Cebi",weather:"Kül yoğunlaşıyor",art:"village",text:()=>{if(!G.flags.looted){G.flags.looted=1;G.gold+=25;G.cor=clamp(G.cor+7,0,100);G.inv.push("ring")}return`Cesedin parmaklarından yüzüğü sökerken siyah mühür nabız gibi atıyor. <i>“Al. Ölülerin ihtiyacı yok.”</i> diye bir ses duyuyorsun. Bunun kendi düşüncen olmadığına eminsin.<br><br><b>25 altın</b> ve <b>Yas Yüzüğü</b> aldın.`},choices:()=>[["Fısıltıyı bastır ve hana git","inn",""],["Fısıltıya cevap ver","whisper","Yozlaşma yolu"]]},
whisper:{loc:"ZİHNİNİN İÇİ",title:"İlk Fısıltı",weather:"Zaman durmuş gibi",art:"crypt",text:()=>{if(!G.flags.whisper){G.flags.whisper=1;G.cor=clamp(G.cor+12,0,100);G.atk+=2}return`“Beni tanımıyorsun, ama kanın tanıyor.”<br><br>Gözlerini açtığında elindeki paslı kılıç daha hafif geliyor. <b>Saldırı +2</b>. Fakat aynadaki gölgen senden yarım saniye geç hareket ediyor.`},choices:()=>[["Lyra'yı bul","lyra",""],["Ormana git","wolf",""]]},
inn:{loc:"KIRIK KILIÇ HANI",title:"Sığınak",weather:"İçeride ateş yanıyor",art:"village",text:()=>`Hanın içinde on iki kişi sessizce oturuyor. Hancı Mara sana yemek uzatıyor. Köşede bir paralı asker, kuzey mezarlığında geceleri bir kapının açıldığını söylüyor.<br><br>Mara: “Bu gece burada kalırsan ücretsiz. Sabah olmayabilir ama en azından sıcak ölürsün.”`,choices:()=>[
["Dinlen ve yaralarını sar","rest","Can/Mana tamamen yenilenir"],
["Paralı askerden bilgi al","rumor","10 altın"],
["Kuzey ormanına çık","wolf","Ana görev"]
]},
rest:{loc:"KIRIK KILIÇ HANI",title:"Kabus",weather:"Şafaktan önce",art:"crypt",text:()=>{G.hp=G.maxHp;G.mp=G.maxMp;G.st=G.maxSt;return`Uykunda bir taht görüyorsun. Tahtta oturan adamın yüzü yok. Başındaki taç kırık.<br><br>Uyandığında göğsüne külle tek kelime yazılmış: <b>VARİS</b>.`},choices:()=>[["Lyra'yı ara","lyra",""],["Ormana git","wolf",""]]},
rumor:{loc:"KIRIK KILIÇ HANI",title:"Satılık Sırlar",weather:"Gece",art:"village",text:()=>{if(!G.flags.rumor&&G.gold>=10){G.gold-=10;G.flags.rumor=1;G.inv.push("key");return`10 altını alan adam sana <b>Gümüş Mahzen Anahtarı</b> veriyor. “Bunu cesetlerden biri yutmuştu. Nedenini sorma.”`}return G.gold<10?"Yeterli altının yok.":`Adam bildiği her şeyi anlattı. Anahtar sende.`},choices:()=>[["Ormana git","wolf",""],["Lyra'yı bul","lyra",""]]},
lyra:{loc:"VEYRA • ARKA SOKAK",title:"Gölgedeki Kadın",weather:"Yağmur hafifledi",art:"village",text:()=>{if(!G.flags.lyra){G.flags.lyra=1;G.quests.push("Tahtın Altındaki Ses")}return`Kadın kapüşonunu indiriyor. Adı <b>Lyra</b>.<br><br>“Siyah mühür yalnızca kralın kanında uyanır. Seni yıllarca sakladılar. Kuzey mahzenine gidersen gerçeği öğrenirsin; ama orada sana benzeyen her şeye güvenme.”<br><br>Sonra ekliyor: “Ve eğer içeriden annenin sesini duyarsan... cevap verme.”`},choices:()=>[["Kim olduğumu anlat","lyraTruth","Daha fazla hikâye"],["Ona güvenmiyorum — ayrıl","wolf",""],["Mührü ona ver","giveSigil","Büyük seçim"]]},
lyraTruth:{loc:"VEYRA",title:"Unutulan Soy",weather:"00:41",art:"village",text:()=>`Lyra'ya çocukluğunu anlatıyorsun: yüzünü hatırlamadığın bir anne, yanan bir malikâne ve her yıl aynı gece gördüğün taç rüyası.<br><br>Lyra'nın yüzü sertleşiyor. “O yangını Ölü Kral çıkarmadı. Yaşayanlar çıkardı.”<br><br><b>Kodeks: Kül Darbesi</b> açıldı.` ,choices:()=>[["Kuzey ormanına git","wolf",""]]},
giveSigil:{loc:"VEYRA",title:"Reddedilen Kader",weather:"Rüzgâr kesildi",art:"crypt",text:()=>`Mührü boynundan çıkarıyorsun. Lyra elini uzatıyor fakat mühür tenine değdiği anda onu yakıyor.<br><br>“Gördün mü?” diyor. “Bu bir eşya değil. Senin bir parçan.”<br><br>Mühür tekrar avucuna dönerken derinin altına siyah damarlar yayılıyor.`,choices:()=>[["Acıya diren","wolf","İrade sınavı"],["Gücün içeri girmesine izin ver","embrace","Yozlaşma +15"]]},
embrace:{loc:"VEYRA",title:"Kanın Hafızası",weather:"Sessizlik",art:"crypt",text:()=>{if(!G.flags.embrace){G.flags.embrace=1;G.cor=clamp(G.cor+15,0,100);G.maxMp+=20;G.mp=G.maxMp}return`Soğuk güç damarlarına doluyor. Bir anlığına Veyra'daki herkesin kalp atışını duyabiliyorsun.<br><br><b>Maksimum Mana +20.</b>`},choices:()=>[["Ormana gir","wolf",""]]},
wolf:{loc:"KUZEY ORMANI",title:"Demir Tasmalı Kurt",weather:"Sis • Görüş düşük",art:"forest",text:()=>`Ağaçların arasında kemiklerin kırılma sesi geliyor. İri bir kurt karanlıktan çıkıyor. Boynunda kraliyet arması taşıyan demir bir tasma var. Gözlerinde doğal olmayan mor bir ışık yanıyor.`,combat:{name:"Bozulmuş Kurt",hp:72,atk:14,def:2,xp:45,gold:22,drop:"fang",next:"crossroad"}},
crossroad:{loc:"KUZEY ORMANI",title:"İki Yol",weather:"01:17",art:"forest",text:()=>`Kurdun tasmasında aynı siyah mühür var. Kuzeyde yol ikiye ayrılıyor: solda terk edilmiş şapel, sağda toprağın altına inen kraliyet merdivenleri.<br><br>Uzakta bir kadın çığlığı duyuluyor.`,choices:()=>[["Çığlığa koş","chapel","Yan görev • İnsanlık yolu"],["Doğrudan mahzene in","cryptDoor","Ana görev"],["Kurdun kanını mühüre sür","blood","Yozlaşma yolu"]]},
blood:{loc:"KUZEY ORMANI",title:"Kan Ayini",weather:"Sis mora dönüyor",art:"forest",text:()=>{if(!G.flags.blood){G.flags.blood=1;G.cor=clamp(G.cor+18,0,100);G.atk+=4;G.hp=Math.max(1,G.hp-20)}return`Kan mühre değdiğinde kurtun son anlarını görüyorsun. Onu dönüştüren kişi bir insan: yüzünde Lyra'nın taşıdığı işaret var.<br><br><b>Saldırı +4, Can -20.</b> Yeni bir şüphe doğdu.`},choices:()=>[["Şapele git","chapel",""],["Mahzene in","cryptDoor",""]]},
chapel:{loc:"TERK EDİLMİŞ ŞAPEL",title:"Kefaret Çanı",weather:"Çan kendi kendine çalıyor",art:"chapel",text:()=>`İçeride bir rahibe taş sunağa zincirlenmiş. Onu koruyan zırhlı yaratık sana dönüyor. Miğferinin içi boş; yalnızca duman var.<br><br>Rahibe fısıldıyor: “Onu öldürürsen içindeki ruh serbest kalacak.”`,choices:()=>[["Şövalyeyle savaş","knight","Rahibeyi kurtar"],["Rahibeyi kurban et","sacrifice","Savaşı atla • Yozlaşma"]]},
knight:{loc:"TERK EDİLMİŞ ŞAPEL",title:"Boş Zırh",weather:"Kefaret Çanı",art:"chapel",text:()=>`Zırh kılıcını kaldırıyor. İçinden onlarca insanın sesi aynı anda konuşuyor: “VARİS.”`,combat:{name:"Mezar Şövalyesi",hp:118,atk:19,def:6,xp:70,gold:45,drop:"crown",next:"nun"}},
sacrifice:{loc:"TERK EDİLMİŞ ŞAPEL",title:"Sessiz Bedel",weather:"Çan durdu",art:"chapel",text:()=>{if(!G.flags.sac){G.flags.sac=1;G.cor=clamp(G.cor+25,0,100);G.inv.push("crown");G.maxHp+=25;G.hp=G.maxHp}return`Zinciri çözmek yerine sunağın üzerindeki bıçağı alıyorsun. Rahibenin gözlerindeki korku kısa sürüyor.<br><br>Boş zırh diz çöküyor. Siyah mühür sıcak kanı emiyor. <b>Maksimum Can +25.</b><br><br>Artık fısıltı senin sesinle konuşuyor.`},choices:()=>[["Mahzene git","cryptDoor",""]]},
nun:{loc:"TERK EDİLMİŞ ŞAPEL",title:"Rahibenin Kehaneti",weather:"Şafak hâlâ yok",art:"chapel",text:()=>{G.humanity=clamp(G.humanity+10,0,100);return`Rahibe kurtulduğunda alnına dokunuyor. “İçinde iki kral var. Biri doğdu, diğeri seni kullanarak doğacak.”<br><br>Sana mahzendeki tahtı <b>kırmanı</b>, asla üzerine oturmamanı söylüyor.`},choices:()=>[["Mahzene ilerle","cryptDoor",""]]},
cryptDoor:{loc:"KRALİYET MAHZENİ",title:"Mühürlü Kapı",weather:"Yeraltı • Zaman bilinmiyor",art:"crypt",text:()=>`Dağın altındaki kapıda üç oyuk var. Siyah mühür ortadaki yuvaya tam oturuyor. Taşların ardından annenin sesini duyuyorsun:<br><br><i>“${G.name}... kapıyı aç. Çok üşüyorum.”</i>`,choices:()=>[
["Kapıyı aç","hall","Mühre güven"],
["Sese cevap ver","mother","Uyarıyı görmezden gel"],
["Geri dön ve hazırlık yap","inn",""]
]},
mother:{loc:"KRALİYET MAHZENİ",title:"Annenin Sesi",weather:"Karanlık",art:"crypt",text:()=>{G.cor=clamp(G.cor+10,0,100);return`“Anne?” dediğin anda duvarın içinden yüzlerce parmak uzanıyor. Ses kahkahaya dönüşüyor.<br><br>“Demek hâlâ çocuksun.”<br><br>Mühür seni koruyor ama bedeli var. <b>Yozlaşma +10.</b>`},choices:()=>[["Kapıyı zorla aç","hall",""]]},
hall:{loc:"KRALİYET MAHZENİ",title:"Atalarının Salonu",weather:"Kül burada yukarı yağıyor",art:"crypt",text:()=>`Kapının ardında yüzlerce heykel var. Hepsinin yüzü kazınmış. En sondaki heykelin yüzü ise sana ait.<br><br>Kaidesinde doğum tarihinden önce yazılmış bir ölüm tarihi görüyorsun.<br><br>Salonun sonunda tahta çıkan merdivenler ve zincirlenmiş bir adam var.`,choices:()=>[["Zincirli adamı serbest bırak","prisoner",""],["Onu sorgula","question",""],["Taht salonuna devam et","guardian",""]]},
prisoner:{loc:"ATALARIN SALONU",title:"İsimsiz Mahkûm",weather:"Fısıltılar",art:"crypt",text:()=>{G.flags.prisoner=1;return`Adam zincirlerden kurtulunca yüzünü gösteriyor: seninle aynı gözlere sahip.<br><br>“Ben senden önceki varisim. Her nesilde birimizi buraya getiriyorlar. Kral uyanmıyor, <b>yeni bir beden seçiyor.</b>”`},choices:()=>[["Onu yanında götür","guardian","Finalde yardım eder"],["Onu öldür","killPrisoner","Gücünü al"]]},
killPrisoner:{loc:"ATALARIN SALONU",title:"Tek Varis",weather:"Mühür yanıyor",art:"crypt",text:()=>{G.cor=clamp(G.cor+20,0,100);G.atk+=5;G.flags.killedPrisoner=1;return`Kılıcın işini bitirdiğinde mühür onun kanını çekiyor. Anıları zihnine doluyor. Taht salonunun kapısını daha önce yüzlerce kez açmış gibi hissediyorsun.<br><br><b>Saldırı +5.</b>`},choices:()=>[["Taht salonuna gir","guardian",""]]},
question:{loc:"ATALARIN SALONU",title:"Döngü",weather:"Sessizlik",art:"crypt",text:()=>`Mahkûm gerçeği anlatıyor: Krallığın “Ölü Kral” dediği şey tek bir adam değil. Kraliyet soyunda beden değiştiren eski bir varlık. Siyah mühür onun anahtarı.<br><br>Lyra'nın örgütü döngüyü kırmak istiyor; fakat bunun için varisin ölmesi gerekebilir.` ,choices:()=>[["Mahkûmu serbest bırak","prisoner",""],["Taht salonuna tek başına git","guardian",""]]},
guardian:{loc:"TAHTIN EŞİĞİ",title:"Son Muhafız",weather:"Kapı nefes alıyor",art:"throne",text:()=>`Taht salonunun önünde üç metre boyunda kemik ve demirden yapılmış bir muhafız ayağa kalkıyor. Göğsündeki boşlukta küçük bir yıldız gibi kırmızı ışık yanıyor.`,combat:{name:"Taht Muhafızı",hp:165,atk:24,def:8,xp:110,gold:80,drop:"ring",next:"throne"}},
throne:{loc:"KÜL TAHTI",title:"Kralın Uyanışı",weather:"Son Çan",art:"throne",text:()=>`Tahtın üzerinde çürümüş bir beden gözlerini açıyor. Fakat konuşan ses onun değil; senin kafanın içinden geliyor.<br><br>“Ben atan değilim. Ben <b>mirasınım</b>. Beni öldürürsen güç sende kalır. Tahta oturursan dünyayı birlikte düzeltiriz. Mührü kırarsan ikimiz de ölebiliriz.”<br><br>Ardından Lyra salona giriyor ve sana bir hançer fırlatıyor. “Seç, ${G.name}. Bu kez seçim gerçekten senin.”`,choices:()=>[
["Ölü Kral'a saldır","kingFight","Özgürlük için savaş"],
["Tahta otur","darkEnd","Karanlık son"],
["Mührü kır","breakEnd","İnsanlık sonu"],
...(G.flags.prisoner?[["Diğer varise güven","heirEnd","Gizli son"]]:[])
]},
kingFight:{loc:"KÜL TAHTI",title:"Bir Hanedanın Sonu",weather:"Gerçeklik parçalanıyor",art:"throne",text:()=>`Ölü Kral bedeninden kalkıyor. Arkasında geçmiş varislerin gölgeleri beliriyor.`,combat:{name:"Ölü Kral",hp:230,atk:29,def:10,xp:200,gold:200,drop:"crown",next:"freeEnd"}},
darkEnd:{loc:"KÜL TAHTI",title:"YENİ KRAL",weather:"Şafak doğmadı",art:"throne",text:()=>{G.ending="Kül Hükümdarı";G.cor=100;return`Tahta oturuyorsun.<br><br>Önce hiçbir şey olmuyor. Sonra Veyra'daki bütün çanlar aynı anda çalıyor. Diz çöken ölüleri kilometrelerce öteden hissediyorsun.<br><br>Lyra hançerini kaldırıyor, fakat sen elini bile oynatmadan dizlerinin üzerine çöküyor.<br><br><b>SON: KÜL HÜKÜMDARI</b><br>Krallığı kurtarmadın. Onu miras aldın.`},choices:()=>[["Yeni kader başlat","restart","Farklı seçimlerle tekrar oyna"]]},
breakEnd:{loc:"KÜL TAHTI",title:"SON MÜHÜR",weather:"İlk güneş",art:"throne",text:()=>{G.ending="Son Mühür";return`Mührü taş zemine vuruyorsun. Çatlaklardan altın ışık çıkıyor. İçindeki ses ilk kez korkuyor.<br><br>Acı dayanılmaz. Kraliyet kanındaki lanet senden koparken dizlerinin üzerine düşüyorsun. Gözlerini açtığında Lyra yanında. Dışarıdan kuş sesleri geliyor.<br><br>Yüz yıldır ilk kez güneş doğmuş.<br><br><b>SON: SON MÜHÜR</b>`},choices:()=>[["Yeni kader başlat","restart",""]]},
heirEnd:{loc:"KÜL TAHTI",title:"İKİ VARİS",weather:"Döngü kırılıyor",art:"throne",text:()=>{G.ending="İki Varis";return`Mührü diğer varise uzatıyorsun. Gücü tek bedende toplamak yerine ikiye bölüyorsunuz. Ölü Kral'ın sesi parçalanıyor.<br><br>Lyra şaşkın: kehanet hiçbir zaman iki varisten söz etmemişti.<br><br>Taht çatlayarak yere gömülüyor. İkiniz de hayattasınız; fakat ikinizin gölgesi de artık size ait değil.<br><br><b>GİZLİ SON: İKİ VARİS</b>`},choices:()=>[["Yeni kader başlat","restart",""]]},
freeEnd:{loc:"KÜL TAHTI",title:"TAHTSIZ",weather:"Şafak",art:"throne",text:()=>{G.ending="Tahtsız";return`Son darbe Ölü Kral'ın göğsünü yarıyor. Siyah mühür çatlıyor fakat yok olmuyor. Güç hâlâ içinde; artık sana emir veren bir ses yok.<br><br>Lyra: “Şimdi ne olacaksın?”<br><br>Tahta bakıp arkanı dönüyorsun.<br><br><b>SON: TAHTSIZ</b>`},choices:()=>[["Yeni kader başlat","restart",""]]}
};
function render(id){if(id==="restart"){localStorage.removeItem("ashesSave");location.reload();return}G.scene=id;let x=SC[id];if(!x)return;$("#combat").style.display="none";$("#location").textContent=x.loc;$("#sceneTitle").textContent=x.title;$("#weather").textContent=x.weather;setHero(x.art);$("#story").innerHTML=typeof x.text==="function"?x.text():x.text;$("#choices").innerHTML="";if(x.combat){startCombat(x.combat)}else (x.choices?x.choices():[]).forEach(c=>choice(...c));ui()}
function choice(label,next,sub){let b=document.createElement("button");b.className="choice";b.innerHTML=`${label}${sub?`<small>${sub}</small>`:""}`;b.onclick=()=>{if(next==="child"){G.humanity=clamp(G.humanity+8,0,100)}render(next)};$("#choices").appendChild(b)}
let E=null, guarding=false;
function startCombat(cfg){E={...cfg,maxHp:cfg.hp};$("#combat").style.display="block";$("#choices").innerHTML="";$("#story").innerHTML+=(G.cor>=50?`<div class="notice">İçindeki karanlık düşmanın korkusunu tadıyor. Yüksek yozlaşma yeteneğini güçlendiriyor.</div>`:"");combatUI()}
function combatUI(){if(!E)return;$("#enemyName").textContent=E.name;$("#enemyHP").textContent=`${E.hp}/${E.maxHp}`;$("#enemyBar").style.width=100*E.hp/E.maxHp+"%";ui()}
function playerHit(kind){if(!E)return;let dmg=0;if(kind==="attack"){if(G.st<10)return msg("Dayanıklığın yetersiz.");G.st-=10;dmg=G.atk+rnd(10)}
if(kind==="skill"){let cost=20;if(G.mp<cost)return msg("Manan yetersiz.");G.mp-=cost;dmg=G.atk+14+rnd(14)+Math.floor(G.cor/10)}
if(kind==="guard"){guarding=true;G.st=clamp(G.st+15,0,G.maxSt);msg("Savunma pozisyonu aldın.");enemyTurn();return}
if(kind==="potion"){let i=G.inv.indexOf("potion");if(i<0)return msg("İksirin yok.");G.inv.splice(i,1);G.hp=clamp(G.hp+45,0,G.maxHp);msg("45 Can yeniledin.");enemyTurn();return}
E.hp=Math.max(0,E.hp-dmg);msg(`${dmg} hasar verdin.`);if(E.hp<=0){winCombat();return}enemyTurn()}
function enemyTurn(){let d=Math.max(1,E.atk+rnd(8)-G.def-(guarding?Math.floor(G.def*.8)+7:0));guarding=false;G.hp=Math.max(0,G.hp-d);G.st=clamp(G.st+8,0,G.maxSt);$("#combatLog").textContent+=` ${E.name} ${d} hasar verdi.`;if(G.hp<=0){G.hp=Math.ceil(G.maxHp*.55);G.mp=Math.ceil(G.maxMp*.5);G.gold=Math.max(0,G.gold-15);G.cor=clamp(G.cor+5,0,100);E=null;$("#combat").style.display="none";G.scene="inn";alert("Ölüm seni kabul etmedi. 15 altın kaybettin ve Veyra'da uyandın.");render("inn");return}combatUI()}
function winCombat(){let e=E;E=null;G.gold+=e.gold;G.xp+=e.xp;G.kills++;if(e.drop)G.inv.push(e.drop);while(G.xp>=100){G.xp-=100;G.level++;G.maxHp+=14;G.maxMp+=8;G.atk+=3;G.def+=1;G.hp=G.maxHp;G.mp=G.maxMp}$("#combat").style.display="none";render(e.next)}
function msg(t){$("#combatLog").textContent=t;ui()}
document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>playerHit(b.dataset.act));
function modal(title,html){$("#modalContent").innerHTML=`<h2>${title}</h2>${html}`;$("#modal").style.display="block"}
function menu(k){if(!G)return;if(k==="char")modal("Karakter",`<div class="card"><b>${G.name}</b><p>${G.cls} • Seviye ${G.level}</p><span class="tag">Saldırı ${G.atk}</span><span class="tag">Savunma ${G.def}</span><span class="tag">İnsanlık ${G.humanity}</span><span class="tag">Yozlaşma ${G.cor}</span><p class="mini">Öldürülen düşman: ${G.kills}<br>Son: ${G.ending||"Henüz belirlenmedi"}</p></div>`);
if(k==="inv")modal("Envanter",`<div class="grid">${G.inv.map(i=>`<div class="card"><b>${ITEMS[i]?.name||i}</b><p class="mini">${ITEMS[i]?.type||""}</p><p>${ITEMS[i]?.desc||""}</p></div>`).join("")||"Çanta boş."}</div>`);
if(k==="skills")modal("Yetenekler",`<div class="grid"><div class="card"><b>${G.skill}</b><p>20 Mana. Saldırı + büyü gücü + yozlaşma bonusu.</p></div><div class="card ${G.cor<35?"locked":""}"><b>Kara Nabız</b><p>Yozlaşma 35'te açılır. Pasif: karanlık seçimler savaş gücünü artırır.</p></div><div class="card ${G.level<3?"locked":""}"><b>İkinci Nefes</b><p>Seviye 3'te açılır. Ölüm cezasını azaltır.</p></div></div>`);
if(k==="quests")modal("Görev Günlüğü",G.quests.map(q=>`<div class="card"><b>${q}</b><p class="mini">Aktif görev</p></div>`).join(""));
if(k==="map")modal("Kül Haritası",`<div class="card" style="text-align:center;font-size:20px;line-height:2.4">♜ Veyra<br>│<br>♣ Kuzey Ormanı ─ ✞ Şapel<br>│<br>▣ Kraliyet Mahzeni<br>│<br>♛ Kül Tahtı</div><p class="mini">Hikâye ilerledikçe bölgeler açılır.</p>`);
if(k==="system")modal("Sistem",`<button class="mainbtn" onclick="manualSave()">OYUNU KAYDET</button><button class="mainbtn" onclick="exportSave()">KAYDI DIŞA AKTAR</button><button class="mainbtn" onclick="resetGame()">YENİ OYUN / KAYDI SİL</button><div class="notice">Oyun her seçimden sonra tarayıcıya otomatik kaydedilir.</div>`)}
window.manualSave=()=>{save();alert("Oyun kaydedildi.")};window.exportSave=()=>{prompt("Kayıt kodun — güvenli bir yere kopyala:",btoa(unescape(encodeURIComponent(JSON.stringify(G)))))};window.resetGame=()=>{if(confirm("Kayıt silinsin mi?")){localStorage.removeItem("ashesSave");location.reload()}};
document.querySelectorAll("[data-menu]").forEach(b=>b.onclick=()=>menu(b.dataset.menu));$("#close").onclick=()=>$("#modal").style.display="none";$("#modal").onclick=e=>{if(e.target.id==="modal")$("#modal").style.display="none"};
Object.entries(CLASSES).forEach(([n,c],idx)=>{let b=document.createElement("button");b.className="classBtn"+(idx===0?" sel":"");b.innerHTML=`<b>${n}</b><div class="mini">${c.desc}</div>`;b.onclick=()=>{selected=n;document.querySelectorAll(".classBtn").forEach(x=>x.classList.remove("sel"));b.classList.add("sel")};$("#classes").appendChild(b)});
$("#newGame").onclick=()=>$("#creator").style.display="block";$("#continueGame").onclick=()=>{let x=load();if(!x)return alert("Kayıt bulunamadı.");G=x;enter()};$("#begin").onclick=()=>{let n=$("#name").value.trim()||"Varis";G=fresh(n,selected);enter()};
</script></body></html>
