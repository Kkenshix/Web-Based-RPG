<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ZERO INDUSTRIES</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b100d;color:#eee;font-family:system-ui;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%}.p{position:fixed;z-index:3;background:#111b16e8;border:1px solid #526054;border-radius:9px;padding:9px}#top{top:8px;left:8px}.gold{color:#e5c465}#panel{right:8px;top:8px;width:min(280px,45vw);max-height:62vh;overflow:auto}#craft{left:8px;top:70px;width:min(250px,44vw);max-height:55vh;overflow:auto}#build{position:fixed;z-index:4;left:8px;right:8px;bottom:8px;display:flex;gap:6px;overflow:auto}button{background:#18231d;color:#eee;border:1px solid #5d6c61;border-radius:8px;padding:9px;white-space:nowrap}.on{color:#f0cf71;border-color:#e0bd59}.row{display:flex;justify-content:space-between;border-bottom:1px solid #2c3931;padding:3px;font-size:11px}h3{font-size:12px;color:#e5c465;margin:5px 0}@media(max-width:600px){.p{font-size:10px}#craft{top:82px}}</style></head>
<body><canvas id="c"></canvas><div id="top" class="p"><b class="gold">ZERO INDUSTRIES</b>　<span id="money"></span>　<span id="pow"></span></div>
<div id="craft" class="p"><h3>ENVANTER / CRAFT</h3><div id="inv"></div><div id="recipes"></div></div>
<div id="panel" class="p"><h3>MILESTONE</h3><div id="mile"></div><small>PC: WASD + E. Mobil: kaynağa yaklaşmak için zemine dokun, kaynağa dokunarak topla. Yapı seçip zemine dokun.</small></div><div id="build"></div>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d'),T=40,S=44;let W,H,d=devicePixelRatio||1;
function rs(){W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}onresize=rs;rs();
let G={x:7,y:7,money:2500,tier:0,mode:null,inv:{wood:8,stone:8,ironOre:0,copperOre:0,coal:0,iron:0,copper:0,plate:0,rod:0,wire:0,gear:0},b:[]};
try{let q=localStorage.ZI;if(q)G=JSON.parse(q)}catch(e){}
const N={wood:'Odun',stone:'Taş',ironOre:'Demir Cevheri',copperOre:'Bakır Cevheri',coal:'Kömür',iron:'Demir Külçe',copper:'Bakır Külçe',plate:'Plaka',rod:'Çubuk',wire:'Tel',gear:'Dişli'};
let nodes=[];function R(n){return(Math.sin(n*928.3)*9999)%1+.5}for(let i=0;i<85;i++){let a=['wood','stone','ironOre','copperOre','coal'];nodes.push({x:2+Math.abs(R(i))*40,y:2+Math.abs(R(i+111))*40,t:a[i%5],a:120})}
const D={miner:['Madenci Mk.I',{plate:8,gear:4},0],furnace:['Fırın',{stone:8,plate:4},0],gen:['Jeneratör',{plate:8,rod:5},0],storage:['Depo',{plate:10,rod:6},0],assembler:['Assembler',{plate:18,gear:8,wire:12},1]};
const rec=[['Demir Külçe',{ironOre:2},{iron:1}],['Bakır Külçe',{copperOre:2},{copper:1}],['Plaka',{iron:2},{plate:1}],['Çubuk',{iron:1},{rod:1}],['Tel',{copper:1},{wire:2}],['Dişli',{plate:2,rod:2},{gear:1}]];
const M=[['MEKANİZASYON I',{plate:35,rod:20,gear:8}],['ENDÜSTRİ II',{plate:100,gear:35,wire:80}]];
function can(o){return Object.entries(o).every(([k,v])=>(G.inv[k]||0)>=v)}function pay(o){for(let k in o)G.inv[k]-=o[k]}
function craft(i){let r=rec[i];if(can(r[1])){pay(r[1]);for(let k in r[2])G.inv[k]=(G.inv[k]||0)+r[2][k];ui()}}
function ms(){let m=M[Math.min(G.tier,1)];if(can(m[1])){pay(m[1]);G.tier++;G.money+=1500;ui()}}
function ui(){money.textContent='$'+G.money.toLocaleString('tr');let p=G.b.filter(b=>b.t==='gen').length*12-G.b.filter(b=>['miner','furnace','assembler'].includes(b.t)).length*2;pow.textContent='Güç '+p;
inv.innerHTML=Object.entries(G.inv).filter(e=>e[1]).map(e=>`<div class=row><span>${N[e[0]]}</span><b>${Math.floor(e[1])}</b></div>`).join('');
recipes.innerHTML=rec.map((r,i)=>`<button onclick="craft(${i})">${r[0]}</button>`).join(' ');
let m=M[Math.min(G.tier,1)];mile.innerHTML=`<b>${m[0]}</b>`+Object.entries(m[1]).map(e=>`<div class=row><span>${N[e[0]]}</span><span>${Math.min(G.inv[e[0]]||0,e[1])}/${e[1]}</span></div>`).join('')+`<button onclick="ms()">TESLİM ET</button>`;
build.innerHTML='';for(let k in D)if(D[k][2]<=G.tier){let q=document.createElement('button');q.textContent=D[k][0];if(G.mode===k)q.className='on';q.onclick=()=>{G.mode=k;ui()};build.append(q)}}
function harvest(n){if(n&&n.a>0&&Math.hypot(n.x-G.x,n.y-G.y)<1.7){let a=Math.min(3,n.a);n.a-=a;G.inv[n.t]+=a;ui()}}
let target=null;c.onpointerdown=e=>{let wx=(e.clientX-W/2)/T+G.x,wy=(e.clientY-H/2)/T+G.y;if(G.mode){let z=D[G.mode];if(can(z[1])){pay(z[1]);G.b.push({x:Math.floor(wx)+.5,y:Math.floor(wy)+.5,t:G.mode,k:0});G.mode=null;ui()}return}let n=nodes.find(n=>n.a>0&&Math.hypot(n.x-wx,n.y-wy)<.65);if(n&&Math.hypot(n.x-G.x,n.y-G.y)<1.7)harvest(n);else target={x:wx,y:wy}};
let keys={};onkeydown=e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='e'){let n=nodes.find(n=>n.a>0&&Math.hypot(n.x-G.x,n.y-G.y)<1.7);harvest(n)}};onkeyup=e=>keys[e.key.toLowerCase()]=0;
function sim(dt){let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0);if(!dx&&!dy&&target){dx=target.x-G.x;dy=target.y-G.y;if(Math.hypot(dx,dy)<.1)target=null}let l=Math.hypot(dx,dy);if(l){G.x+=dx/l*3*dt;G.y+=dy/l*3*dt}G.x=Math.max(1,Math.min(43,G.x));G.y=Math.max(1,Math.min(43,G.y));
let power=G.b.filter(b=>b.t==='gen').length*12-G.b.filter(b=>['miner','furnace','assembler'].includes(b.t)).length*2;for(let b of G.b){b.k+=dt;if(b.k<1.5||power<0)continue;b.k=0;if(b.t==='miner'){let n=nodes.find(n=>n.a>0&&Math.hypot(n.x-b.x,n.y-b.y)<1.8);if(n){n.a--;G.inv[n.t]++}}if(b.t==='furnace'){if(G.inv.ironOre>=2){G.inv.ironOre-=2;G.inv.iron++}else if(G.inv.copperOre>=2){G.inv.copperOre-=2;G.inv.copper++}}if(b.t==='assembler'&&G.inv.iron>=2){G.inv.iron-=2;G.inv.plate++}}}
function draw(){x.clearRect(0,0,W,H);x.save();x.translate(W/2-G.x*T,H/2-G.y*T);for(let j=0;j<S;j++)for(let i=0;i<S;i++){x.fillStyle=(i+j)%2?'#17221b':'#19251d';x.fillRect(i*T,j*T,T,T);x.strokeStyle='#233229';x.strokeRect(i*T,j*T,T,T)}
for(let n of nodes)if(n.a>0){x.fillStyle={wood:'#52764f',stone:'#858983',ironOre:'#9e6856',copperOre:'#c37750',coal:'#363a38'}[n.t];x.beginPath();x.arc(n.x*T,n.y*T,12,0,7);x.fill()}
for(let b of G.b){x.fillStyle={miner:'#c59b48',furnace:'#a65c42',gen:'#65975f',storage:'#897451',assembler:'#607ea7'}[b.t];x.fillRect((b.x-.4)*T,(b.y-.4)*T,T*.8,T*.8)}
x.fillStyle='#f3d16d';x.beginPath();x.arc(G.x*T,G.y*T,10,0,7);x.fill();x.restore()}
let last=performance.now(),u=0;function loop(t){let dt=Math.min(.05,(t-last)/1000);last=t;sim(dt);draw();u+=dt;if(u>.6){u=0;ui()}requestAnimationFrame(loop)}ui();requestAnimationFrame(loop);setInterval(()=>localStorage.ZI=JSON.stringify(G),15000);
</script></body></html>
